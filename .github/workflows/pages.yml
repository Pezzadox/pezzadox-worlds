# Builds the app script and fonts, then publishes www/ to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - name: Add the video studio page (Kyle's queue; it asks for a sign-in)
        env:
          PW_SUPABASE_URL: ${{ secrets.PW_SUPABASE_URL }}
          PW_SUPABASE_ANON_KEY: ${{ secrets.PW_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p www/studio
          cp site/video-studio.html www/studio/index.html
          node -e "require('fs').writeFileSync('www/studio/config.js','window.PW_STUDIO='+JSON.stringify({url:(process.env.PW_SUPABASE_URL||'').trim().replace(/\/+\$/,''),anon:(process.env.PW_SUPABASE_ANON_KEY||'').trim()})+';')"
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
