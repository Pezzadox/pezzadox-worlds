<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pezzadox player</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a{position:absolute;inset:auto 0 16px;text-align:center;color:#fff;font:600 15px system-ui,sans-serif}
</style>
</head>
<body>
<!-- Used by the Pezzadox Worlds app to play YouTube videos inside the app. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var v = (q.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20);
  var t = Math.max(0, parseInt(q.get('t') || '0', 10) || 0);
  if (!v) { document.body.innerHTML = '<a href="https://www.youtube.com/@Pezzadox">Watch on YouTube</a>'; return; }
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube-nocookie.com/embed/' + v + '?autoplay=1&playsinline=1&rel=0&modestbranding=1' + (t ? '&start=' + t : '');
  f.title = 'Pezzadox video';
  f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
  f.setAttribute('allowfullscreen', '');
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
